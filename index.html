
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Signup Form</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <div class="container">

    <!-- Login Form -->
    <form id="loginForm" novalidate>
      <h2>Welcome Back!</h2>
      <p class="subtitle">Login to your account</p>

      <p class="success" id="loginSuccess"></p>

      <div class="form-group">
        <label for="loginEmail">Email Address</label>
        <input type="text" id="loginEmail"
               placeholder="Enter your email">
        <span class="error" id="loginEmailError"></span>
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword"
               placeholder="Enter your password">
        <span class="error" id="loginPasswordError"></span>
      </div>

      <button type="submit">Login</button>

      <p class="switch">
        Don't have an account?
        <a href="#" id="showSignup">Sign Up</a>
      </p>
    </form>

    <!-- Signup Form -->
    <form id="signupForm" class="hidden" novalidate>
      <h2>Create Account</h2>
      <p class="subtitle">Sign up to get started</p>

      <p class="success" id="signupSuccess"></p>

      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name"
               placeholder="Enter your name">
        <span class="error" id="nameError"></span>
      </div>

      <div class="form-group">
        <label for="signupEmail">Email Address</label>
        <input type="text" id="signupEmail"
               placeholder="Enter your email">
        <span class="error" id="signupEmailError"></span>
      </div>

      <div class="form-group">
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword"
               placeholder="Minimum 8 characters">
        <span class="error" id="signupPasswordError"></span>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword"
               placeholder="Confirm your password">
        <span class="error" id="confirmPasswordError"></span>
      </div>

      <button type="submit">Create Account</button>

      <p class="switch">
        Already have an account?
        <a href="#" id="showLogin">Login</a>
      </p>
    </form>

  </div>

</body>
</html>
